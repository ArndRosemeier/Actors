[package]
name = "actors-engine"
description = "Actors characters for ArndRosemeier/Engine: a CharacterConfig becomes an engine AnimatedModel (skinned meshes, textures, clips)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
actors-core.workspace = true
actors-human.workspace = true
actors-generator.workspace = true
indexmap.workspace = true
# Follows Engine main (the lock file pins the commit), so games on Engine main get one Engine.
engine = { git = "https://github.com/ArndRosemeier/Engine", branch = "main" }
glam = "0.33"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
