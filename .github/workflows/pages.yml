# Builds the character generator (importer -> pack -> Vite build) and deploys it to GitHub Pages.
# Pull requests only build and test; pushes to main (or a manual run) also deploy.
name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Downloads (MPFB2 clone, MakeHuman asset packs, Quaternius animations) are cached between runs.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: import-cache-${{ hashFiles('tools/import-makehuman/src/**') }}
          restore-keys: import-cache-
      - run: npm run import:human
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/viewer/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
