# Builds the character generator (importer -> pack -> Vite build) and deploys it to GitHub Pages.
# Pull requests only build and test; pushes to main (or a manual run) also deploy.
# It also builds the installable packages and, on main, publishes them as GitHub release
# v<version> when that release doesn't exist yet (bump the package versions to cut a new one).
name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the package release on main
    # The first run downloads the CMU mocap (~6 GB) once; later runs reuse the converted clips from the cache.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Downloads (MPFB2 clone, MakeHuman asset packs, Quaternius and Mesh2Motion animations) are cached between runs.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: import-cache-${{ hashFiles('tools/import-makehuman/src/**', 'tools/import-animals/src/**') }}
          restore-keys: import-cache-
      - run: npm run import:human
      # Dog and squirrel packs: Mesh2Motion's CC0 quadruped rig and clips plus generated bodies.
      - run: npm run import:animals
      - run: npm run build
      # A fresh Vite + TypeScript app installs the package tarballs, typechecks and builds.
      - run: npm run check:consumer
      # Release tarballs (dependencies point at the release URLs) plus the asset packs archive.
      - run: npm run build:packages
      - name: Publish GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./packages/generator/package.json').version")
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "release v$version exists; bump the package versions to publish a new one"
          else
            gh release create "v$version" release/*.tgz release/actors-packs-*.tar.gz \
              --target "$GITHUB_SHA" --title "Actors $version" \
              --notes "Install: \`npm install https://github.com/${GITHUB_REPOSITORY}/releases/download/v$version/actors-generator-$version.tgz three\`. Assets: \`npx actors-packs\` or the hosted packs. See docs/using-actors.md."
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/viewer/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
